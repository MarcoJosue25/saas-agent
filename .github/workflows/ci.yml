name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Base de datos solo para las pruebas, GitHub la crea y la borra en cada ejecución
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: negocios_saasagent
          MYSQL_USER: saas_agent
          MYSQL_PASSWORD: clave_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar y correr los tests
        run: ./mvnw -B clean test
        env:
          DB_URL: jdbc:mysql://localhost:3306/negocios_saasagent
          DB_USER: saas_agent
          DB_PASSWORD: clave_ci